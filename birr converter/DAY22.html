<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="DAY22.css">
    <title>Birr Watch</title>
</head>
<body>
    <h1>Birr Watch</h1>
    <p id = "status">Loading rates</p>
    <form id="convert-form">
        <input id="amount" type="number" value="100" min = "1" /><!--the value show our starting amount is 100-->
        <select id="currency"></select>
        <button type="submit">Convert</button>
        <button type="button" id="watch">Add to Watchlist</button>
    </form><!--this form do group input elements and allow handling submission events by js-->
    <p id="result"></p>
    <h2>Watchlist</h2>
    <ul id="watchlist"></ul>
    <script src="DAY22.js"></script>
</body>
</html>
